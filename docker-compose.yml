services:

  # ── Database (MariaDB) ────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: shopadmin-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: shopadmin_db
      MARIADB_USER: shopadmin_user
      MARIADB_PASSWORD: shopadmin_pass
    ports:
      - "3307:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Backend API ──────────────────────────────────────────────────────────
  api:
    build: ./api
    container_name: shopadmin-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_URL: jdbc:mariadb://db:3306/shopadmin_db
      DB_USER: shopadmin_user
      DB_PASSWORD: shopadmin_pass
      JWT_PASSPHRASE: local-docker-jwt-secret-2024
    ports:
      - "8081:8081"

  # ── Frontend ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8081/api
    container_name: shopadmin-web
    restart: unless-stopped
    depends_on:
      - api
    environment:
      PORT: 5173
    ports:
      - "5173:5173"

volumes:
  db-data:
