<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopAdmin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  </head>
  <body>
    <!-- Hidden SVG liquid-glass displacement filter -->
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
      <defs>
        <filter id="lg-refract" color-interpolation-filters="sRGB"
                x="-8%" y="-8%" width="116%" height="116%">
          <feTurbulence type="fractalNoise" baseFrequency="0.018 0.022"
                        numOctaves="3" seed="9" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="5"
                             xChannelSelector="R" yChannelSelector="G" result="displaced"/>
          <feComposite in="displaced" in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>
    </svg>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
