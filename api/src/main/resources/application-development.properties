# ── H2 in-memory database (run ApiApplication directly from IDE) ──────────
spring.datasource.url=jdbc:h2:mem:shopadmin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate (dialect auto-detected for H2 — no need to set it explicitly)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT (dev — 24-hour tokens so you're not constantly re-logging in)
app.jwt.issuer=shopadmin
app.jwt.passphrase=shopadmin-dev-jwt-secret-passphrase-change-in-production
app.jwt.expiration=86400
