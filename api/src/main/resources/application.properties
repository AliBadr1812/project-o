spring.application.name=api
server.port=8081
server.servlet.context-path=/api

spring.profiles.active=development

# ── JPA / Hibernate ───────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false

# Batch processing
spring.jpa.properties.hibernate.jdbc.batch_size=3000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# ── Connection pool ───────────────────────────────────────────────────────
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ── Logging ───────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.ali_b1812.app=INFO
logging.level.org.springframework.boot=INFO

# ── JWT ───────────────────────────────────────────────────────────────────
app.jwt.issuer=shopadmin
app.jwt.passphrase=shopadmin-dev-jwt-secret-passphrase-change-in-production
app.jwt.expiration=900

# ── Actuator ──────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
