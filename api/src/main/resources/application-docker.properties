# ── MariaDB — credentials injected by docker-compose ─────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.show-sql=false

# Connection pool (larger for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# JWT — override JWT_PASSPHRASE in docker-compose for each deployment
app.jwt.issuer=shopadmin
app.jwt.passphrase=${JWT_PASSPHRASE:change-this-in-production}
app.jwt.expiration=900
