# ── MariaDB — credentials injected by docker-compose ─────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never

# Batch inserts
spring.jpa.properties.hibernate.jdbc.batch_size=5000
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.batch_versioned_data=true

# Connection pool (larger for production)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Logging
logging.level.root=WARN
logging.level.com.ali_b1812.app=INFO
logging.level.org.springframework.boot=INFO

# JWT — override JWT_PASSPHRASE in docker-compose for each deployment
app.jwt.issuer=shopadmin
app.jwt.passphrase=${JWT_PASSPHRASE:change-this-in-production}
app.jwt.expiration=900

# Actuator — health check for Docker
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
